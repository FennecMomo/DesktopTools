name: 发布 DesktopTools 版本

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 读取发布文件
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 核对标签、版本和包体摘要
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 build_release.py --verify-only --tag "$RELEASE_TAG"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(gh release create "$GITHUB_REF_NAME" \
            dist/DesktopTools.exe dist/update.json \
            --title "DesktopTools $GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag 2>&1)
          result=$?
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$output"
            exit "$result"
          fi
          printf '%s\n' "$output"
